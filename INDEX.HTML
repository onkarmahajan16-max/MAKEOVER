<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHANGE ME — Character Studio</title><style>*{box-sizing:border-box}body{margin:0;font:16px system-ui;background:#fff0f8;color:#52213f}header{text-align:center;padding:20px}h1{color:#d7248d;letter-spacing:4px;margin:0}p{line-height:1.6;color:#92647e;font-size:14px}.layout{max-width:980px;margin:auto;display:grid;grid-template-columns:1fr 370px;gap:20px;padding:15px}.studio{background:radial-gradient(ellipse at top,#ffd1ed,#f36dbb);border:7px solid white;border-radius:30px;overflow:hidden}svg{display:block;width:100%;height:540px;touch-action:none}.panel{padding:24px;border-radius:24px;background:white;align-self:start}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{cursor:pointer;font:600 14px system-ui;border:2px solid #f1d0e3;border-radius:14px;padding:14px;background:#fff5fb;color:#64284a}button.active{background:#ffdaef;border-color:#e02d91}button:disabled{opacity:.4;cursor:not-allowed}.primary{width:100%;background:#df288d;color:white;border:0;margin-top:18px}.secondary{width:100%;margin-top:10px}.steps{text-align:center;font-size:13px;color:#a14b7a;padding:0 10px}.meter{height:12px;background:#fae0ef;border-radius:15px;margin:15px 0;overflow:hidden}.meter div{background:#d93194;height:100%;transition:width .3s}.note{max-width:950px;margin:10px auto;padding:0 20px}h2{margin-top:0}@media(max-width:730px){.layout{grid-template-columns:1fr}svg{height:430px}}.spark{animation:pulse 1s infinite alternate}@keyframes pulse{to{opacity:.2}}</style><header><h1>CHANGE ME</h1><p>A new character. A new transformation.</p></header><div class="steps" id="steps"></div><main class="layout"><div class="studio"><svg viewBox="0 0 400 560" id="view" xmlns="http://www.w3.org/2000/svg"></svg></div><section class="panel"><h2 id="title"></h2><p id="description"></p><div id="options"></div><button class="primary" id="next"></button><button class="secondary" id="restart">Choose another character</button></section></main><p class="note">Every new round returns to character selection. Clothes, shoes, hairstyles, and cleaning reset for the character you choose.</p><script>
const $=id=>document.getElementById(id);const people=[{name:'Leo',type:'Boy',skin:'#edb58c',hair:'#653c26',long:false,adult:false},{name:'Mia',type:'Girl',skin:'#b97850',hair:'#36221e',long:true,adult:false},{name:'Adam',type:'Man',skin:'#d3956b',hair:'#302420',long:false,adult:true},{name:'Zara',type:'Woman',skin:'#805039',hair:'#211b24',long:true,adult:true},{name:'Noah',type:'Boy',skin:'#8e583b',hair:'#211b19',long:false,adult:false},{name:'Lily',type:'Girl',skin:'#f2c4a1',hair:'#a65a31',long:true,adult:false},{name:'Kai',type:'Man',skin:'#e4ac82',hair:'#1e1c25',long:false,adult:true},{name:'Eva',type:'Woman',skin:'#e1b18f',hair:'#8c5d34',long:true,adult:true}];
let round=0;try{round=Number(localStorage.getItem('changeMeRounds'))||0}catch(e){}let stage=0,person=0,wash=0,cloth=-1,shoe=-1,hair=-1,original=false;const outfits=[['Everyday casual','#42a6ad'],['Cozy hoodie','#a277d4'],['Smart outfit','#f0f2ff'],['Formal suit','#283e70'],['Evening outfit','#b82d75'],['Streetwear','#e6a449']];const shoes=[['White sneakers','#f4f2f9'],['Leather boots','#75503b'],['Colorful high-tops','#db438d'],['Formal shoes','#262638'],['Sport trainers','#42959d'],['Pastel sneakers','#c5a2e5']];const styles=['Swept waves','Clean fade','Spiky cut','Long layers','Curly style','Bob cut'];
function draw(){const p=people[person],clean=original?0:wash,c=original?-1:cloth,s=original?-1:shoe,h=original?-1:hair;let hairShape='';let long=h===3||h===5||(h<0&&p.long);if(long)hairShape=`<path d="M133 148q-15-101 65-104 83 0 70 105l13 ${h===5?'67':'119'}q-75 26-160 0z" fill="${p.hair}"/>`;let top=h===1?'M143 131q-9-74 56-74 65 0 58 74l-13-39h-88z':h===2?'M140 133l-4-48 21 8 4-41 24 19 13-39 19 35 27-22-1 38 22-7-9 57-17-37-69-3z':'M142 137q-24-54 17-77 5-23 40-18 40-10 57 22 19 25 1 73l-15-40q-30 5-47-21-13 27-41 29z';let topHair=`<path d="${top}" fill="${p.hair}" stroke="#32202a" stroke-width="2"/>`;if(h===4){for(let i=0;i<9;i++)topHair+=`<circle cx="${144+i*14}" cy="${70-Math.sin(i/8*Math.PI)*15}" r="17" fill="${p.hair}"/>`}
let detail=c===3?'<path d="M170 220l30 90 30-90-30 14z" fill="white"/><path d="M198 240l-8 44 10 10 10-10-8-44" fill="#dd4c98"/>':c===1?'<path d="M172 222q-6 36 28 38 34-2 28-38M175 302h50v22h-50z" fill="none" stroke="#775293" stroke-width="3"/>':c===2?'<path d="M170 220l30 24 30-24m-30 24v112" stroke="#b9bfd4" stroke-width="3" fill="none"/>':'';
$('view').innerHTML=`<defs><linearGradient id="skin" x2="1" y2="1"><stop stop-color="${p.skin}"/><stop offset="1" stop-color="${p.skin}" stop-opacity=".8"/></linearGradient></defs><ellipse cx="200" cy="525" rx="105" ry="16" fill="#b84386" opacity=".25"/>${long?hairShape:''}<g ${p.adult?'':'transform="translate(20 40) scale(.9)"'}><path d="M150 349l12 148h32l7-124 9 124h33l7-148" fill="${c<0?'#73695c':'#354768'}" stroke="#493846" stroke-width="3"/><path d="M161 489q-24 6-29 28h64v-28zm49 0v28h66q-7-25-32-28z" fill="${s<0?'#8c775d':shoes[s][1]}" stroke="#51414e" stroke-width="3"/><path d="M143 226q-22 6-30 41l-19 89q-4 20 11 23 16 4 21-17l21-75m110-61q22 6 30 41l19 89q4 20-11 23-16 4-21-17l-21-75" fill="${p.skin}" stroke="#805447" stroke-width="2"/><path d="M171 192v33q29 22 57 0v-33" fill="${p.skin}"/><path d="M170 219l-32 10-16 58 26 11-2 69q55 15 109 0l-3-69 26-11-16-58-34-10q-28 25-58 0z" fill="${c<0?'#9c8e76':outfits[c][1]}" stroke="#55424e" stroke-width="3"/>${detail}${c<0?'<path d="M159 302l17 5-5 15-12-9m70 24l16 5-12 12" fill="#c49973" stroke="#71604a" stroke-width="2"/>':''}<ellipse cx="143" cy="147" rx="12" ry="21" fill="${p.skin}"/><ellipse cx="257" cy="147" rx="12" ry="21" fill="${p.skin}"/><path d="M143 113q0-62 57-62t57 62v51q-6 38-57 56-51-18-57-56z" fill="url(#skin)" stroke="#96644d" stroke-width="2"/><path d="M157 140q14-12 28-1m29 0q14-12 28 1" fill="none" stroke="${p.hair}" stroke-width="5" stroke-linecap="round"/><path d="M158 151q14-11 28 0-14 12-28 0m56 0q14-11 28 0-14 12-28 0" fill="white" stroke="#684b41" stroke-width="2"/><g fill="#354e5e"><ellipse cx="174" cy="151" rx="5" ry="6"/><ellipse cx="228" cy="151" rx="5" ry="6"/></g><path d="M200 153l-4 20 9 1" stroke="#a97256" stroke-width="2" fill="none"/><path d="M184 187q16 ${stage===5&&!original?'15':'-3'} 32 0" stroke="#9d4e46" stroke-width="3" fill="none" stroke-linecap="round"/>${topHair}<g opacity="${.55*(1-clean/100)}" fill="#73513b"><ellipse cx="158" cy="172" rx="10" ry="6"/><ellipse cx="238" cy="184" rx="9" ry="6"/><ellipse cx="110" cy="338" rx="5" ry="12"/><ellipse cx="292" cy="313" rx="5" ry="11"/><ellipse cx="200" cy="260" rx="16" ry="9"/></g></g>${stage===5&&!original?'<g class="spark" fill="#fff8b1"><path d="M85 130l6 17 17 6-17 6-6 17-6-17-17-6 17-6zm225 190l6 17 17 6-17 6-6 17-6-17-17-6 17-6z"/></g>':''}<text x="200" y="553" text-anchor="middle" fill="#762755" font-family="system-ui" font-size="14">${p.name} • ${p.type}</text>`}
function render(){draw();$('steps').textContent=['Choose character','1 · Wash','2 · Clothes','3 · Shoes','4 · Hairstyle','Makeover reveal'].map((s,i)=>i===stage?'[ '+s+' ]':s).join('  /  ');$('options').innerHTML='';$('next').style.display=stage===5?'none':'';$('restart').style.display=stage===0?'none':'';const titles=['Choose your character','Stage 1 — Wash','Stage 2 — Select clothes','Stage 3 — Select shoes','Stage 4 — Select hairstyle','Makeover complete!'];$('title').textContent=titles[stage];$('description').textContent=stage===0?'Choose a boy, girl, man, or woman. Everyone starts with the same wash-to-makeover journey.':stage===1?'Tap Wash or drag over the character. Clean fully to unlock the next stage.':stage===5?'Your character is clean and styled! Compare the result or start with someone new.':'Tap an option to preview it, then continue.';let grid=document.createElement('div');grid.className='grid';$('options').append(grid);
if(stage===0){people.forEach((_,j)=>{let i=(j+round*2)%people.length,p=people[i],b=document.createElement('button');b.textContent=p.name+' · '+p.type;b.className=i===person?'active':'';b.onclick=()=>{person=i;render()};grid.append(b)});$('next').disabled=false;$('next').textContent='Start makeover'}else if(stage===1){$('options').innerHTML=`<div class="meter"><div style="width:${wash}%"></div></div><p>Cleanliness: ${wash}%</p><button id="wash">Wash with soap & water</button>`;$('wash').onclick=clean;$('next').disabled=wash<100;$('next').textContent='Select clothes'}else if(stage<5){let list=stage===2?outfits.map(x=>x[0]):stage===3?shoes.map(x=>x[0]):styles;let selected=stage===2?cloth:stage===3?shoe:hair;list.forEach((name,i)=>{let b=document.createElement('button');b.textContent=name;b.className=i===selected?'active':'';b.onclick=()=>{if(stage===2)cloth=i;if(stage===3)shoe=i;if(stage===4)hair=i;render()};grid.append(b)});$('next').disabled=selected<0;$('next').textContent=stage===4?'Reveal makeover':'Continue'}else{grid.innerHTML='<button id="compare">Show before</button><button id="again">New character</button>';$('compare').onclick=()=>{original=!original;draw();$('compare').textContent=original?'Show makeover':'Show before'};$('again').onclick=restart}}
function clean(){if(stage!==1||wash>=100)return;wash=Math.min(100,wash+10);render()}function restart(){round++;try{localStorage.setItem('changeMeRounds',round)}catch(e){}stage=0;person=round*2%people.length;wash=0;cloth=shoe=hair=-1;original=false;render()}
$('next').onclick=()=>{stage++;render()};$('restart').onclick=restart;let down=false,last=0;$('view').onpointerdown=e=>{down=true;$('view').setPointerCapture(e.pointerId);clean()};$('view').onpointermove=()=>{if(down&&Date.now()-last>140){last=Date.now();clean()}};$('view').onpointerup=()=>down=false;$('view').onpointercancel=()=>down=false;person=round*2%people.length;render();</script></html>
